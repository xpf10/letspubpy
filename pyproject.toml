[project]
name = "letspubpy"
version = "0.1.0"
description = "A publication-ready plotting library wrapping Lets-Plot in Python, mimicking R's ggpubr."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lets-plot>=4.11.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letspubpy"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
