site_name: letspubpy
site_description: A publication-ready plotting library wrapping Lets-Plot, mimicking R's ggpubr
site_url: https://xpf10.github.io/letspubpy
repo_url: https://github.com/xpf10/letspubpy
repo_name: xpf10/letspubpy

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - header.autohide
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/chart-timeline

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            members_order: source
            show_signature: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples: examples.md
  - Standard Plots:
      - Boxplot: plots/boxplot.md
      - Violin: plots/violin.md
      - Raincloud: plots/raincloud.md
      - Bar Plot: plots/barplot.md
      - Line Plot: plots/lineplot.md
      - Scatter: plots/scatter.md
      - Histogram: plots/histogram.md
      - Density: plots/density.md
      - Pie & Donut: plots/pie.md
      - Q-Q Plot: plots/qqplot.md
      - ECDF: plots/ecdf.md
      - Correlation Heatmap: plots/corrplot.md
  - Heatmaps & Clusters:
      - Heatmap & Clustered Heatmap: plots/heatmap.md
      - Cluster Dual-View (visCluster): plots/viscluster.md
      - Pseudotime Heatmap: plots/pseudotime.md
  - Omics & Bioinformatics:
      - Volcano Plot: plots/volcano.md
      - GWAS Manhattan Plot: plots/manhattan.md
      - UpSet Intersections: plots/upset.md
      - GSEA & Pathway Enrichment: plots/enrichment.md
  - Clinical & Statistical Charts:
      - Kaplan-Meier Survival: plots/survival.md
      - Forest Plot: plots/forest.md
      - ROC & PRC Curves: plots/roc.md
      - Dose-Response & IC50: plots/doseresponse.md
      - RECIST Waterfall Plot: plots/waterfall.md
      - Bland-Altman Agreement: plots/blandaltman.md
      - Radar / Spider Chart: plots/radar.md
  - Statistical Annotations:
      - stat_compare_means: stats/compare-means.md
      - stat_cor: stats/correlation.md
      - stat_regline_equation: stats/regline-equation.md
  - Themes & Palettes: themes-and-palettes.md
  - Layout & Utilities: layout-and-utilities.md
  - API Reference: api-reference.md
  - Changelog: changelog.md
